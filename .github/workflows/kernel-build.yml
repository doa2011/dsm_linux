name: Build SA6400 Kernel (Built-in)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: epyc7002-7.2-5.10.55
          
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flex bison m4 bc libelf-dev libssl-dev dwarves zstd python3 cpio rsync gcc make kmod

      - name: Copy Synology config
        run: |
          cp synology/synoconfigs/epyc7002 .config
          
      - name: Enable kernel modules
        run: |
          # GPIO/PIN控制器 (模块)
          scripts/config --module CONFIG_PINCTRL_INTEL
          scripts/config --module CONFIG_PINCTRL_JASPERLAKE
          
          # CPU温度监控 (模块)
          scripts/config --module CONFIG_SENSORS_CORETEMP
          scripts/config --module CONFIG_INTEL_POWERCLAND
          scripts/config --module CONFIG_INTEL_POWERCLAMP
          
          # 热管理 (模块)
          scripts/config --module CONFIG_ACPI_THERMAL
          
          # PWM/LPSS (模块)
          scripts/config --module CONFIG_PWM_LPSS
          scripts/config --module CONFIG_PWM_LPSS_PCI
          scripts/config --module CONFIG_PWM_LPSS_PLATFORM
          
          # 硬盘热插拔 (模块)
          scripts/config --module CONFIG_SCSI_SCAN_ASYNC

      - name: Build kernel and modules
        run: |
          make -j$(nproc) bzImage modules ARCH=x86_64 CC=gcc

      - name: Package bzImage
        run: |
          tar -czvf bzImage.tar.gz arch/x86/boot/bzImage

      - name: Package modules
        run: |
          # 找出所有编译出的 .ko 模块
          find . -name "*.ko" -type f | tar -czvf modules.tar.gz -T -

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            bzImage.tar.gz
            modules.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
