name: Build SA6400 Kernel + Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: epyc7002-7.2-5.10.55
          
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flex bison m4 bc libelf-dev libssl-dev dwarves zstd python3 cpio rsync gcc make kmod

      - name: Copy Synology config
        run: |
          cp synology/synoconfigs/epyc7002 .config
          
      - name: Enable pinctrl modules
        run: |
          scripts/config --module CONFIG_PINCTRL_JASPERLAKE
          scripts/config --module CONFIG_PINCTRL_INTEL

      - name: Build kernel and modules
        run: |
          make -j$(nproc) bzImage modules ARCH=x86_64 CC=gcc

      - name: Package bzImage
        run: |
          tar -czvf bzImage.tar.gz arch/x86/boot/bzImage

      - name: Upload bzImage
        uses: actions/upload-artifact@v4
        with:
          name: bzImage
          path: bzImage.tar.gz
          retention-days: 1

      - name: Package pinctrl modules
        run: |
          tar -czvf pinctrl-modules.tar.gz drivers/pinctrl/intel/pinctrl-*.ko

      - name: Upload pinctrl modules
        uses: actions/upload-artifact@v4
        with:
          name: pinctrl-modules
          path: pinctrl-modules.tar.gz
          retention-days: 1
